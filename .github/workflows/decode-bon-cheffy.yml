name: decode-bon-cheffy-pngs
on:
  push:
    branches: [feat/bon-cheffy-character]
    paths:
      - 'characters/bon-cheffy/*.png.b64'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 sheets to PNG
        run: |
          set -euo pipefail
          d=characters/bon-cheffy
          test -f "$d/directions.png.b64"
          test -f "$d/reactions.png.b64"
          base64 -d "$d/directions.png.b64" > "$d/directions.png"
          base64 -d "$d/reactions.png.b64" > "$d/reactions.png"
          python3 - <<'PY'
          from pathlib import Path
          for name in ("directions.png", "reactions.png"):
              p = Path("characters/bon-cheffy") / name
              assert p.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n", name
              print(name, "ok", p.stat().st_size)
          PY
          rm -f "$d/directions.png.b64" "$d/reactions.png.b64"
          rm -f "$d/.binary-test.png" "$d/.tiny-test.png"
          rm -f .github/workflows/decode-bon-cheffy.yml
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A characters/bon-cheffy .github/workflows/decode-bon-cheffy.yml || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add Bon Cheffy PNG sheets (decoded from b64 transport)"
          git push
