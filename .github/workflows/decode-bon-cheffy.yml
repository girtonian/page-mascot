name: decode-bon-cheffy-pngs
on:
  push:
    branches: [feat/bon-cheffy-character]
    paths:
      - 'characters/bon-cheffy/**'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'b64-transport')
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 sheets to PNG
        run: |
          set -euo pipefail
          d=characters/bon-cheffy
          if [ -f "$d/sheets.b64.txt.part00" ]; then
            cat "$d"/sheets.b64.txt.part* > "$d/sheets.b64.txt"
            rm -f "$d"/sheets.b64.txt.part*
          fi
          test -f "$d/sheets.b64.txt"
          python3 - <<'PY2'
          from pathlib import Path
          import base64, re
          text = Path("characters/bon-cheffy/sheets.b64.txt").read_text()
          for name in ("directions.png", "reactions.png"):
              m = re.search(rf"###BEGIN {re.escape(name)}###\n(.*?)\n###END {re.escape(name)}###", text, re.S)
              assert m, name
              raw = base64.b64decode(re.sub(r"\s+", "", m.group(1)))
              assert raw[:8] == b"\x89PNG\r\n\x1a\n", name
              Path("characters/bon-cheffy", name).write_bytes(raw)
              print(name, "ok", len(raw))
          PY2
          rm -f "$d/sheets.b64.txt" "$d"/directions.png.b64* "$d"/reactions.png.b64* || true
          rm -f .github/workflows/decode-bon-cheffy.yml
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A characters/bon-cheffy .github/workflows/decode-bon-cheffy.yml || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Restore Bon Cheffy white hat band"
          git push
